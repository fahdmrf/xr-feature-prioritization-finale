name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild the app and check that the committed index.html is up to date
        run: |
          python build_app.py
          git diff --exit-code app/index.html
      - name: Run tests
        run: python -m unittest discover -s tests -v
